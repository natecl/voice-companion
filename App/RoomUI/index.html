<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Ellis — Companion room</title><link rel="stylesheet" href="room.css"><link rel="stylesheet" href="runtime.css"><script src="icons.js" defer></script><script src="room.js" defer></script></head><body><div id="companion-room" class="viz-dotted-background">

<section class="device" aria-label="Companion">
<div class="status"><b>9:41</b><span><i data-lucide="signal"></i><i data-lucide="wifi"></i><i data-lucide="battery-full"></i></span></div>
<div class="shell"><header><button class="round" data-act="notes" aria-label="Open notes"><i data-lucide="equal"></i></button><div class="persona"><img src="companion.png" alt="Temporary companion character"><b>Ellis</b></div><button class="invite-friends" data-act="invite-friends">Invite</button></header>
<div class="chat" aria-live="polite"><div class="day">Today</div><div class="bubble welcome">Hey, good to see you.</div><div class="bubble">What’s on your mind?</div><p class="hint">In a conversation? Tap + to invite me in. You can keep talking here, too.</p></div>

<div class="dock"><div class="capture" hidden><div class="capture-info"><span class="recording-dot" aria-hidden="true"></span><span class="capture-word">Listening</span><time>0:00</time></div><button data-act="transcript">View</button><button data-act="quiet" aria-label="Quiet mode"><i data-lucide="bell"></i></button><button class="stop" data-act="end" aria-label="End recording"><i data-lucide="square"></i></button></div><div class="attachment" hidden><span>A small test, then build</span><button data-act="detach" aria-label="Remove attachment"><i data-lucide="x"></i></button></div><div class="compose-row"><div class="composer"><button class="clip" data-act="attach" aria-label="Attach note"><i data-lucide="paperclip"></i></button><textarea rows="1" placeholder="Message Ellis" aria-label="Message Ellis"></textarea><button class="send" data-act="send" aria-label="Dictate a message"><i data-lucide="mic"></i></button></div><button class="plus" data-act="invite" aria-label="Invite Ellis into the conversation"><i data-lucide="plus"></i></button></div><div class="home"></div></div></div>
<section class="library" inert aria-label="Your notes"><div class="library-head"><button class="round" data-act="chat" aria-label="Back to Ellis"><i data-lucide="arrow-left"></i></button><span>Notes</span><button class="round" data-act="focus-search" aria-label="Search notes"><i data-lucide="search"></i></button></div><div class="library-scroll"><label class="note-search"><i data-lucide="search"></i><input type="search" placeholder="Find a conversation" aria-label="Find a conversation"></label><h1>Your notes</h1><p class="subtitle">The conversations you can come back to.</p><p class="empty-search" hidden>No notes match yet. Try another word.</p></div><div class="home"></div></section>
<div class="overlay" hidden><section class="panel" role="dialog" aria-modal="true" aria-label="Companion panel"><div class="grip"></div><div class="panel-head"><h2></h2><button class="round" data-act="close" aria-label="Close panel"><i data-lucide="x"></i></button></div><div class="panel-body"></div></section></div><div class="toast" hidden role="status"></div>
</section></div></body></html>
