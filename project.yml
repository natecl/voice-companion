name: VoiceCompanion
options:
  bundleIdPrefix: ai.voicecompanion
  deploymentTarget:
    iOS: '18.0'
    macOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Turn your speech into an editable companion message when you tap Dictate."
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "Capture speech when you record a conversation or dictate a message."
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    exactVersion: 9.2.0
  ThinkingOrbsKit:
    path: Vendor/ThinkingOrbsKit
targets:
  VoiceCompanionMac:
    type: application
    dependencies:
      - package: ThinkingOrbsKit
      - package: GoogleSignIn
        product: GoogleSignIn
    platform: macOS
    info:
      path: App/Mac-Info.plist
      properties:
        GIDClientID: 774278865935-2142r4ndqoruu9jcug5s8uk44q2aj7bq.apps.googleusercontent.com
        GIDServerClientID: 774278865935-gjppp5pd2i4hpatuf8nctteb9m0adf9c.apps.googleusercontent.com
        EllisAccountEndpoint: wss://voice-companion-sdbr.onrender.com/account
        CFBundleURLTypes:
          - CFBundleURLSchemes: [com.googleusercontent.apps.774278865935-2142r4ndqoruu9jcug5s8uk44q2aj7bq]
    entitlements:
      path: App/Accounts/Mac.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        keychain-access-groups: ["$(AppIdentifierPrefix)$(CFBundleIdentifier)"]
    sources:
      - path: App
        excludes: [RoomUI]
      - path: App/RoomUI
        type: folder
        buildPhase: resources
      - path: Fixtures/transcript-events.json
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        PRODUCT_BUNDLE_IDENTIFIER: ai.voicecompanion.mac
        PRODUCT_NAME: VoiceCompanion
  VoiceCompanionPhone:
    type: application
    dependencies:
      - package: ThinkingOrbsKit
      - package: GoogleSignIn
        product: GoogleSignIn
    platform: iOS
    sources:
      - path: App
        excludes: [RoomUI]
      - path: App/RoomUI
        type: folder
        buildPhase: resources
      - path: Fixtures/transcript-events.json
        buildPhase: resources
    info:
      path: App/Phone-Info.plist
      properties:
        UIBackgroundModes: [audio]
        GIDClientID: 774278865935-knco8v1bf8u8qudkj3fn7bab73am87d6.apps.googleusercontent.com
        GIDServerClientID: 774278865935-gjppp5pd2i4hpatuf8nctteb9m0adf9c.apps.googleusercontent.com
        EllisAccountEndpoint: wss://voice-companion-sdbr.onrender.com/account
        CFBundleURLTypes:
          - CFBundleURLSchemes: [com.googleusercontent.apps.774278865935-knco8v1bf8u8qudkj3fn7bab73am87d6]
    entitlements:
      path: App/Accounts/Phone.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        PRODUCT_BUNDLE_IDENTIFIER: ai.voicecompanion.phone
        PRODUCT_NAME: VoiceCompanion
        TARGETED_DEVICE_FAMILY: '1'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connect to your Mac development relay for live transcription."
  CoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [UnitTests, App/Transcription, App/Sessions, App/Audio]
  MacUITests:
    type: bundle.ui-testing
    platform: macOS
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: UITests/MacUITests.entitlements
    sources: [UITests]
    dependencies:
      - target: VoiceCompanionMac
  PhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: VoiceCompanionPhone
schemes:
  Mac:
    build:
      targets:
        VoiceCompanionMac: all
    test:
      targets: [CoreTests, MacUITests]
  Phone:
    build:
      targets:
        VoiceCompanionPhone: all
    test:
      targets: [PhoneUITests]
