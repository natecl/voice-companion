name: VoiceCompanion
options:
  bundleIdPrefix: ai.voicecompanion
  deploymentTarget:
    iOS: '18.0'
    macOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "Capture speech for the transcript when you start a recording session."
targets:
  VoiceCompanionMac:
    type: application
    platform: macOS
    sources:
      - App
      - path: Fixtures/transcript-events.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.voicecompanion.mac
        PRODUCT_NAME: VoiceCompanion
  VoiceCompanionPhone:
    type: application
    platform: iOS
    sources:
      - App
      - path: Fixtures/transcript-events.json
        buildPhase: resources
    info:
      path: App/Phone-Info.plist
      properties:
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.voicecompanion.phone
        PRODUCT_NAME: VoiceCompanion
        TARGETED_DEVICE_FAMILY: '1'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connect to your Mac development relay for live transcription."
  CoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [UnitTests, App/Transcription, App/Sessions, App/Audio]
  MacUITests:
    type: bundle.ui-testing
    platform: macOS
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: UITests/MacUITests.entitlements
    sources: [UITests]
    dependencies:
      - target: VoiceCompanionMac
  PhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: VoiceCompanionPhone
schemes:
  Mac:
    build:
      targets:
        VoiceCompanionMac: all
    test:
      targets: [CoreTests, MacUITests]
  Phone:
    build:
      targets:
        VoiceCompanionPhone: all
    test:
      targets: [PhoneUITests]
